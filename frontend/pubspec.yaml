name: tensionpath
description: Frontend app for Tension Path
publish_to: none
version: 0.0.1+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  get_it: ^7.6.4
  flame: ^1.13.1
  logger: ^2.0.2+1
  dafluta: ^5.1.1
  url_strategy: ^0.2.0
  shared_preferences: ^2.2.2

  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  firebase_analytics: ^10.7.4
  firebase_crashlytics: ^3.4.8
  cloud_functions: ^4.5.8
  cloud_firestore: ^4.13.6

  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter 

dev_dependencies:
  dalocale: ^2.4.2
  daassets: ^1.3.2
  daunused: ^1.3.0
  dapublock: ^1.0.1
  build_runner: ^2.4.7
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/battlefield/
    - assets/images/launcher/
    - assets/images/node/
    - assets/images/node/icon/
    - assets/images/unit/