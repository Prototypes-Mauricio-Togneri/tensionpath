name: tensionpath
description: Frontend app for Tension Path
publish_to: none
version: 0.0.1+1

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  get_it: ^7.7.0
  flame: ^1.18.0
  logger: ^2.3.0
  dafluta: ^5.3.0
  url_strategy: ^0.2.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.2.3

  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  firebase_analytics: ^11.1.0
  firebase_crashlytics: ^4.0.2
  cloud_functions: ^5.0.2
  cloud_firestore: ^5.0.2

  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter 

dev_dependencies:
  dalocale: ^2.5.0
  daassets: ^1.5.0
  daunused: ^1.6.1
  dapublock: ^1.1.0
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/battlefield/
    - assets/images/launcher/
    - assets/images/node/
    - assets/images/node/icon/
    - assets/images/unit/