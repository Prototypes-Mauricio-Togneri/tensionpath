name: tensionpath
description: Frontend app for Tension Path
publish_to: none
version: 0.0.1+1

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  web: ^1.1.1
  flame: ^1.33.0
  logger: ^2.6.2
  get_it: ^8.3.0
  dafluta: ^5.6.0
  just_audio: ^0.10.5
  json_annotation: ^4.9.0
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.3

  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  firebase_analytics: ^12.0.3
  firebase_crashlytics: ^5.0.3
  cloud_functions: ^6.0.3
  cloud_firestore: ^6.0.3

  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

dev_dependencies:
  dalocale: ^2.6.0
  daassets: ^1.5.0
  daunused: ^1.8.1
  dapublock: ^1.1.0
  build_runner: ^2.10.1
  flutter_lints: ^6.0.0
  json_serializable: ^6.11.1

flutter:
  uses-material-design: true

  assets:
    - assets/audio/music/
    - assets/audio/sound/effects/
    - assets/audio/sound/voice/attack/
    - assets/audio/sound/voice/eva/
    - assets/audio/sound/voice/movement/
    - assets/images/battlefields/
    - assets/images/buildings/
    - assets/images/other/
    - assets/images/structures/
    - assets/images/units/counter/
    - assets/images/units/cards/infantry/
    - assets/images/units/cards/vehicle/
    - assets/images/units/cards/aircraft/
    - assets/images/units/player_1/harvester/
    - assets/images/units/player_1/infantry/
    - assets/images/units/player_1/vehicle/
    - assets/images/units/player_1/aircraft/
    - assets/images/units/player_2/harvester/
    - assets/images/units/player_2/infantry/
    - assets/images/units/player_2/vehicle/
    - assets/images/units/player_2/aircraft/
    - assets/text/
