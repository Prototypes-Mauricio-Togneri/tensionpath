name: tensionpath
description: Frontend app for Tension Path
publish_to: none
version: 0.0.1+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  get_it: ^7.6.4
  flame: ^1.10.1
  logger: ^2.0.2+1
  dafluta: ^5.1.1
  url_strategy: ^0.2.0

  firebase_core: 2.20.0
  firebase_analytics: 10.6.2
  firebase_crashlytics: 3.4.2

  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter 

dev_dependencies:
  dalocale: ^2.4.2
  daassets: ^1.3.2
  daunused: ^1.3.0
  dapublock: ^1.0.1
  build_runner: ^2.4.6
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/