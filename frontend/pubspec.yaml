name: tensionpath
description: Frontend app for Tension Path
publish_to: none
version: 0.0.1+1

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  web: ^1.1.1
  uuid: ^4.5.1
  flame: ^1.32.0
  logger: ^2.6.2
  get_it: ^8.2.0
  dafluta: ^5.6.0
  just_audio: ^0.10.5
  json_annotation: ^4.9.0
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.3

  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  firebase_analytics: ^12.0.2
  firebase_crashlytics: ^5.0.2
  cloud_functions: ^6.0.2
  cloud_firestore: ^6.0.2

  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

dev_dependencies:
  dalocale: ^2.6.0
  daassets: ^1.5.0
  daunused: ^1.7.4
  dapublock: ^1.1.0
  build_runner: ^2.7.1
  flutter_lints: ^6.0.0
  json_serializable: ^6.11.1

flutter:
  uses-material-design: true

  assets:
    - assets/audio/music/
    - assets/audio/sound/
    - assets/images/battlefields/
    - assets/images/structures/
    - assets/images/units/counter/
    - assets/images/units/cards/infantry/
    - assets/images/units/cards/vehicle/
    - assets/images/units/cards/aircraft/
    - assets/images/units/player_1/harvester/
    - assets/images/units/player_1/infantry/
    - assets/images/units/player_1/vehicle/
    - assets/images/units/player_1/aircraft/
    - assets/images/units/player_2/harvester/
    - assets/images/units/player_2/infantry/
    - assets/images/units/player_2/vehicle/
    - assets/images/units/player_2/aircraft/
