name: tensionpath
description: Frontend app for Tension Path
publish_to: none
version: 0.0.1+1

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  get_it: ^7.6.7
  flame: ^1.15.0
  logger: ^2.0.2+1
  dafluta: ^5.2.0
  url_strategy: ^0.2.0
  json_annotation: ^4.8.1
  web_socket_channel: 2.4.0
  shared_preferences: ^2.2.2

  firebase_core: ^2.25.4
  firebase_auth: ^4.17.4
  firebase_analytics: ^10.8.5
  firebase_crashlytics: ^3.4.14
  cloud_functions: ^4.6.5
  cloud_firestore: ^4.15.4

  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter 

dev_dependencies:
  dalocale: ^2.4.2
  daassets: ^1.3.2
  daunused: ^1.5.0
  dapublock: ^1.0.1
  build_runner: ^2.4.8
  flutter_lints: ^3.0.1
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/battlefield/
    - assets/images/launcher/
    - assets/images/node/
    - assets/images/node/icon/
    - assets/images/unit/