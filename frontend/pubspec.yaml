name: tensionpath
description: Frontend app for Tension Path
publish_to: none
version: 0.0.1+1

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  web: ^1.1.1
  uuid: ^4.5.1
  flame: ^1.32.0
  logger: ^2.6.1
  get_it: ^8.2.0
  dafluta: ^5.5.1
  url_strategy: ^0.3.0
  json_annotation: ^4.9.0
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.3

  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  firebase_analytics: ^12.0.1
  firebase_crashlytics: ^5.0.1
  cloud_functions: ^6.0.1
  cloud_firestore: ^6.0.1

  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

dev_dependencies:
  dalocale: ^2.6.0
  daassets: ^1.5.0
  daunused: ^1.7.4
  dapublock: ^1.1.0
  build_runner: ^2.7.1
  flutter_lints: ^6.0.0
  json_serializable: ^6.11.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/battlefields/
    - assets/maps/
